# tywb — Tiny Wayback configuration
#
# All values here can be overridden by environment variables (env vars win).
# See the configuration reference in README.md for the full mapping.
#
# AWS credentials follow standard AWS SDK precedence:
#   1. Environment variables (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY)
#   2. Values in this file (only if env vars are absent)
#   3. ~/.aws/credentials / instance metadata (standard SDK fallback)

# ── S3 / Object Storage ──────────────────────────────────────────────────────
s3:
  # Required: bucket containing WARC and PDF files.
  bucket: "warc"

  # AWS region (or S3-compatible region string).
  # Override with: AWS_DEFAULT_REGION
  region: "garage"

  # Optional: custom endpoint for MinIO, Cloudflare R2, Backblaze B2, etc.
  # Leave unset to use standard AWS S3.
  # Override with: AWS_ENDPOINT_URL
  endpoint_url: "https://s3.dornseif.cloud"

  # Optional: force path-style addressing (required for MinIO / some S3-compat).
  force_path_style: true

  # Credentials — prefer env vars (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY).
  # Only set here if you cannot use environment variables.
  # access_key_id:     ""
  # secret_access_key: ""

  # Optional: restrict bucket listing to keys under this prefix.
  # Override with: WARC_S3_PREFIX
  # prefix: "crawls/2024/"

  # Number of parallel S3 listing / download workers.
  # Override with: WARC_S3_CONCURRENCY
  concurrency: 4

# ── Index Storage (local) ────────────────────────────────────────────────────
storage:
  # Directory for Tantivy fulltext index segments.
  # Override with: WARC_INDEX_PATH
  # index_path: "/var/lib/warc-search/index"
  index_path: "./var/index"

  # Path to the SQLite CDX database.
  # Override with: WARC_CDX_DB_PATH
  # cdx_db_path: "/var/lib/warc-search/cdx.db"
  cdx_db_path: "./var/cdx.db"

  # SQLite page-cache size in KiB.  8 MiB is intentionally small to stay
  # within the 1–2 GB RAM budget.  Increase for faster CDX queries on large
  # archives if RAM allows.
  sqlite_cache_kib: 8192

# ── Indexer ───────────────────────────────────────────────────────────────────
indexer:
  # How many Tantivy documents to accumulate before flushing to disk.
  # Larger batches = faster ingest, higher peak RAM during ingest.
  # Reduce if the indexer runs out of memory on a small machine.
  batch_size: 5000

  # Maximum body-text length extracted from each HTML/PDF record (bytes).
  # Prevents very large pages from dominating index RAM during ingest.
  max_text_bytes: 524288  # 512 KiB

  # Extract and index text from PDF records. Requires a Tika backend below;
  # with `tika` unset this has no effect (PDFs stay browsable but unsearchable).
  index_pdfs: true

  # Index WARC response records (HTML, text, etc.).
  # Set to false to build a CDX-only index without fulltext search.
  index_warc_responses: true

  # URL glob patterns to skip during ingest (matched against WARC-Target-URI).
  # Useful for excluding static assets that add noise to the fulltext index.
  # skip_patterns:
  #   - "*.css"
  #   - "*.js"
  #   - "*.png"
  #   - "*.jpg"

  # Domains to exclude from indexing.
  #
  # Records whose WARC-Target-URI belongs to a listed domain — or any of its
  # subdomains — are silently skipped during ingest.  In addition, each time
  # `tywb index` runs it removes all existing CDX and fulltext entries for
  # these domains before processing new WARC files.  Adding a domain here and
  # running `tywb index` is sufficient to scrub it from the index entirely.
  #
  # Subdomain matching is automatic: "example.com" also covers
  # "www.example.com", "cdn.example.com", "deep.sub.example.com", etc.
  #
  # blacklisted_domains:
  #   - spam-site.example.com
  #   - ads.example.net

  # ── PDF text extraction (optional) ─────────────────────────────────────────
  # An Apache Tika server that turns PDFs into searchable text. Leave the whole
  # `tika` block out to disable PDF fulltext entirely (the default) — nothing
  # else changes and no external service is needed.
  #
  # Tika (PDFBox) reads the text layer of born-digital PDFs; for pure scans it
  # runs Tesseract OCR. Extraction happens during `tywb index`, not at query
  # time. See playbooks/tika.yml in the ops repo for a hardened deployment.
  #
  # tika:
  #   # A running tika-server. Keep it bound to localhost — Tika parses hostile
  #   # third-party files and must not be exposed on the network.
  #   url: "http://127.0.0.1:9998"
  #   # no_ocr = text layer only; auto = OCR only when there is no text layer;
  #   # ocr_only = always OCR. "auto" suits a mix of digital and scanned PDFs.
  #   ocr_strategy: "auto"
  #   # Tesseract languages. frk = Fraktur, for older German prints.
  #   ocr_languages: "deu+frk+eng"
  #   # PDFs larger than this are skipped rather than sent to Tika.
  #   max_pdf_bytes: 104857600  # 100 MiB
  #   # Per-document timeout; OCR of a big scan can be slow.
  #   timeout_secs: 300

  # ── Extra collections (optional) ───────────────────────────────────────────
  # Additional sources indexed alongside the primary WARC bucket (which is the
  # implicit collection "warc"). Each is searched and browsed together with the
  # archive; the `collection` is recorded per CDX entry and drives which bucket
  # replay reads from. The Tika/PDF path above applies to every collection.
  #
  # Currently supported type: pdf_bucket — a bucket of standalone PDF objects,
  # each indexed and replayed directly (no WARC container). The object's public
  # URL is public_base_url + key.
  #
  # collections:
  #   - name: obst-pdfs
  #     type: pdf_bucket
  #     bucket: obst-pdfs.23.nu
  #     public_base_url: "https://obst-pdfs.23.nu/"
  #     # prefix: ""   # optional key prefix

# ── Server ────────────────────────────────────────────────────────────────────
server:
  # Address and port for the HTTP server.
  # Override with: WARC_SERVER_BIND
  bind: "0.0.0.0:8080"

  # Maximum number of fulltext search results returned per query.
  # The /search JSON API and /ui/search HTML page both respect this limit.
  # Requests may ask for fewer via the `limit` parameter (capped at 500).
  max_results: 50

  # Enable the Wayback-compatible replay API at /web/{timestamp}/{url}.
  # When enabled, replayed HTML pages receive a sticky toolbar and wombat.js
  # URL rewriting automatically.  Disable only if you need a CDX/search-only
  # deployment without serving archived content.
  enable_replay: true

  # Optional: directory of static files to serve under /_static/.
  # Leave unset unless you are customising the web UI.
  # static_dir: "/var/lib/warc-search/ui"

  # Optional: static text file of URL prefixes to hide from search results.
  # Query-time filter only — matching records stay indexed and replayable.
  # One prefix per line, '#' comments allowed. Edit + restart to apply; no
  # re-index needed. Distinct from indexer.blacklisted_domains, which drops
  # data at ingest time.
  # search_blacklist_path: "/etc/tywb/search-blacklist.txt"

# ── Logging ───────────────────────────────────────────────────────────────────
log:
  # Tracing filter — same syntax as RUST_LOG.
  # Examples: "info", "debug", "tywb=debug,info", "warn"
  # Override with: RUST_LOG
  level: "info"
