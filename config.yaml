# tywb — Tiny Wayback configuration
#
# All values here can be overridden by environment variables (env vars win).
# See the configuration reference in README.md for the full mapping.
#
# AWS credentials follow standard AWS SDK precedence:
#   1. Environment variables (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY)
#   2. Values in this file (only if env vars are absent)
#   3. ~/.aws/credentials / instance metadata (standard SDK fallback)

# ── S3 / Object Storage ──────────────────────────────────────────────────────
s3:
  # Required: bucket containing WARC and PDF files.
  bucket: "warc"

  # AWS region (or S3-compatible region string).
  # Override with: AWS_DEFAULT_REGION
  region: "garage"

  # Optional: custom endpoint for MinIO, Cloudflare R2, Backblaze B2, etc.
  # Leave unset to use standard AWS S3.
  # Override with: AWS_ENDPOINT_URL
  #
  # Point this at the object store directly. A reverse proxy in front of it
  # must pass requests through unchanged: SigV4 signs a list of headers, so a
  # proxy that adds or rewrites one (`accept-encoding` is the usual culprit)
  # turns every request into
  #   400 InvalidRequest: signed header `accept-encoding` is not present
  # which reads like a credentials problem and is not one.
  endpoint_url: "https://s3.foxel.org"

  # Optional: force path-style addressing (required for MinIO / some S3-compat).
  force_path_style: true

  # Credentials — prefer env vars (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY).
  # Only set here if you cannot use environment variables.
  # access_key_id:     ""
  # secret_access_key: ""

  # Optional: restrict bucket listing to keys under this prefix.
  # Override with: WARC_S3_PREFIX
  # prefix: "crawls/2024/"

  # Number of parallel S3 listing / download workers.
  # Override with: WARC_S3_CONCURRENCY
  concurrency: 4

# ── Index Storage (local) ────────────────────────────────────────────────────
storage:
  # Directory for Tantivy fulltext index segments.
  # Override with: WARC_INDEX_PATH
  # index_path: "/var/lib/warc-search/index"
  index_path: "./var/index"

  # Path to the SQLite CDX database.
  # Override with: WARC_CDX_DB_PATH
  # cdx_db_path: "/var/lib/warc-search/cdx.db"
  cdx_db_path: "./var/cdx.db"

  # SQLite page-cache size in KiB.  8 MiB is intentionally small to stay
  # within the 1–2 GB RAM budget.  Increase for faster CDX queries on large
  # archives if RAM allows.
  sqlite_cache_kib: 8192

# ── Indexer ───────────────────────────────────────────────────────────────────
indexer:
  # How many Tantivy documents to accumulate before flushing to disk.
  # Larger batches = faster ingest, higher peak RAM during ingest.
  # Reduce if the indexer runs out of memory on a small machine.
  batch_size: 5000

  # Maximum body-text length extracted from each HTML/PDF record (bytes).
  # Prevents very large pages from dominating index RAM during ingest.
  max_text_bytes: 524288  # 512 KiB

  # Extract and index text from PDF records. Requires a Tika backend below;
  # with `tika` unset this has no effect (PDFs stay browsable but unsearchable).
  index_pdfs: true

  # Index WARC response records (HTML, text, etc.).
  # Set to false to build a CDX-only index without fulltext search.
  index_warc_responses: true

  # ── Skip list ──────────────────────────────────────────────────────────────
  # One list, applied everywhere: matching records are not indexed, are purged
  # from the index on the next `tywb index` run, AND are hidden from search
  # results immediately (query-time filter). It has two halves.
  #
  # 1. Domains — drop a whole site. Subdomain matching is automatic:
  #    "google.com" also covers "www.google.com", "maps.google.com", etc.
  #
  # 2. URL patterns — drop a kind of page on sites that are otherwise wanted:
  #    wiki talk pages, version histories, `action=edit` links. Regular
  #    expressions matched against the whole URL, unanchored, `(?i)` for
  #    case-insensitivity. The shipped skip-urls.txt covers MediaWiki and
  #    DokuWiki cruft. A pattern that matches the empty string is refused at
  #    startup — it would match every URL and purge the whole index.
  #
  # The recommended way is a static file per half, editable without re-rendering
  # this config (a server restart applies the display filter; a re-index purges
  # already-stored entries):
  #   blacklisted_domains_path:      "/etc/tywb/skip-domains.txt"  # one domain per line
  #   blacklisted_url_patterns_path: "/etc/tywb/skip-urls.txt"     # one regex per line
  #
  # Inline lists work too and are merged with the files:
  #   blacklisted_domains:
  #     - instagram.com
  #     - google.com
  #     - pinterest.com
  #   blacklisted_url_patterns:
  #     - "(?i)[?&]action=(edit|history)"
  #     - "(?i)(/|[?&]title=)(Diskussion|Talk):"
  #
  # The server shows the list at /ui/skiplist and serves it as an exclusion
  # file for the Zeno crawler at /skiplist.zeno, so the same rules keep cruft
  # out of the crawl too.

  # ── PDF text extraction (optional) ─────────────────────────────────────────
  # An Apache Tika server that turns PDFs into searchable text. Leave the whole
  # `tika` block out to disable PDF fulltext entirely (the default) — nothing
  # else changes and no external service is needed.
  #
  # Tika (PDFBox) reads the text layer of born-digital PDFs; for pure scans it
  # runs Tesseract OCR. Extraction happens during `tywb index`, not at query
  # time. See playbooks/tika.yml in the ops repo for a hardened deployment.
  #
  # tika:
  #   # A running tika-server. Keep it bound to localhost — Tika parses hostile
  #   # third-party files and must not be exposed on the network.
  #   url: "http://127.0.0.1:9998"
  #   # no_ocr = text layer only; auto = OCR only when there is no text layer;
  #   # ocr_only = always OCR. "auto" suits a mix of digital and scanned PDFs.
  #   # Use "no_ocr" for a collection that was OCR'd before upload: it rules out
  #   # an index run quietly spending hours in Tesseract on text that is
  #   # already there.
  #   ocr_strategy: "auto"
  #   # Tesseract languages. frk = Fraktur, for older German prints.
  #   ocr_languages: "deu+frk+eng"
  #   # PDFs larger than this are skipped rather than sent to Tika. Each skip is
  #   # logged at WARN with the key and size — high-resolution library scans run
  #   # to several hundred MB and are exactly the documents worth having.
  #   max_pdf_bytes: 104857600  # 100 MiB
  #   # Per-document timeout; OCR of a big scan can be slow.
  #   timeout_secs: 300

  # ── OCR text cache (optional) ──────────────────────────────────────────────
  # Decouples OCR from the index run: with this block set, `tywb index` never
  # calls Tika itself. A PDF record's text is read from this cache (keyed by
  # the record's content digest), and on a miss the record is *queued* for
  # `tywb ocr-worker`, which extracts in its own process and stores the result
  # here. The next index run — or the next full rebuild — finds the text on
  # disk. The cache directory must live outside any per-rebuild directory, so
  # a rebuild swap ("tywb-reindex-swap") does not move or discard it.
  #
  # On the WARC-path side of the indexer, extraction of a scanned PDF without a
  # text layer is the item that made a full rebuild measure 63.7 hours of idle
  # time (85 % of its wall time) — the OCR result ran against Tika's timeout,
  # was discarded just short of the finish, and was forgotten with the run.
  # See `crates/tywb/src/ocr_cache.rs` and the Arbeitssanweisung Nr. 2.
  #
  # ocr_cache:
  #   path: "/var/lib/warc-search/ocr-cache"
  #   # documents the worker extracts in parallel (Tika is memory-bound)
  #   workers: 2
  #   # attempts before a job is parked in <path>/failed/ (visible, not lost)
  #   max_attempts: 3
  #   # The worker's own Tika backend — a full `tika` block, URL included, so it
  #   # can run against its own server with a generous timeout. Unset: the
  #   # global indexer.tika above.
  #   tika:
  #     url: "http://127.0.0.1:9998"
  #     timeout_secs: 21600
  #
  # Fill the cache before the next rebuild:
  #   tywb ocr-worker --prefill
  # then drain the queue:
  #   tywb ocr-worker

  # ── Extra collections (optional) ───────────────────────────────────────────
  # Additional sources indexed alongside the primary WARC bucket (which is the
  # implicit collection "warc"). Each is searched and browsed together with the
  # archive; the `collection` is recorded per CDX entry and drives which bucket
  # replay reads from. The Tika/PDF path above applies to every collection, and
  # each collection may adjust it for itself — see the `tika:` block below.
  #
  # Currently supported type: pdf_bucket — a bucket of standalone PDF objects,
  # each indexed and replayed directly (no WARC container). The object's public
  # URL is public_base_url + key.
  #
  # One bucket can carry several collections, split by key prefix — useful when
  # only part of it should be indexed, or when the parts deserve separate names
  # in the UI. Prefixes are matched literally, so "archive-org/" does not reach
  # into "archive-org-ocr/".
  #
  # collections:
  #   - name: obst-pdfs
  #     type: pdf_bucket
  #     bucket: obst-pdfs.23.nu
  #     public_base_url: "https://obst-pdfs.23.nu/"
  #     # prefix: ""   # optional key prefix
  #     # store_text: true  # keep the extracted text as <key>.tywb.txt beside
  #     #   the object and read it back instead of extracting again. Extraction
  #     #   is the expensive half — OCR of a scanned volume is tens of minutes —
  #     #   and the index does not keep the text it indexed, so without this
  #     #   every later improvement to text handling costs the whole run again.
  #     #   The sidecar records the source ETag and is ignored once that
  #     #   changes. Needs write access to the bucket; off by default.
  #     # key_pattern: ""  # optional regex over the key, on top of the prefix.
  #     #   A prefix can only name a contiguous run of keys. When the material
  #     #   worth separating is interleaved with the rest — a digitisation whose
  #     #   volumes each sit in their own directory — the pattern names the rest
  #     #   of the rule. Non-matching objects are left untouched, not recorded as
  #     #   seen, so a later collection over the same prefix still gets them:
  #     #   list the narrower collection first and it claims what is its.
  #   - name: pomologie
  #     type: pdf_bucket
  #     bucket: obst-pdfs.23.nu
  #     prefix: "pomologie-ocr/"
  #     public_base_url: "https://obst-pdfs.23.nu/"
  #     # Text extraction for this collection only, layered over the `tika`
  #     # block above — state what is special, inherit the rest (the URL always
  #     # comes from there; one Tika server serves everything).
  #     #
  #     # A digitised corpus and a web crawl want opposite settings, and before
  #     # this they had to share one: `auto` sends pre-OCR'd scans through
  #     # Tesseract for nothing, and a limit sized for web PDFs drops the
  #     # library volumes that are worth the most.
  #     tika:
  #       ocr_strategy: "no_ocr"        # already OCR'd before upload
  #       max_pdf_bytes: 629145600      # 600 MiB — library scans are big
  #       # ocr_languages: "deu+frk"
  #       # timeout_secs: 1500          # keep below Tika's taskTimeoutMillis
  #
  # `tywb index --collections-only` indexes just these and leaves the WARC
  # bucket alone — the way to add a collection without re-walking the archive.

# ── Server ────────────────────────────────────────────────────────────────────
server:
  # Address and port for the HTTP server.
  # Override with: WARC_SERVER_BIND
  bind: "0.0.0.0:8080"

  # Maximum number of fulltext search results returned per query.
  # The /search JSON API and /ui/search HTML page both respect this limit.
  # Requests may ask for fewer via the `limit` parameter (capped at 500).
  max_results: 50

  # Enable the Wayback-compatible replay API at /web/{timestamp}/{url}.
  # When enabled, replayed HTML pages receive a sticky toolbar and wombat.js
  # URL rewriting automatically.  Disable only if you need a CDX/search-only
  # deployment without serving archived content.
  enable_replay: true

  # Optional: directory of static files to serve under /_static/.
  # Leave unset unless you are customising the web UI.
  # static_dir: "/var/lib/warc-search/ui"
  #
  # To hide domains from search results, use indexer.blacklisted_domains_path
  # (the single domain skip list above) — it applies at both index and display.

# ── Logging ───────────────────────────────────────────────────────────────────
log:
  # Tracing filter — same syntax as RUST_LOG.
  # Examples: "info", "debug", "tywb=debug,info", "warn"
  # Override with: RUST_LOG
  level: "info"
